<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        .box {
            background: white;
            width: 500px;
            margin: auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: #333;
        }

        input {
            margin: 20px;
        }

        button {
            padding: 10px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>AI Resume Analyzer</h1>

    <p>Upload your resume and analyze it.</p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input type="file" name="resume" accept=".pdf" required>

        <br>

        <button type="submit">
            Upload Resume
        </button>

    </form>

</div>

</body>
</html>
